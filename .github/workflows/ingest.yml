name: ingest

on:
  schedule:
    # Mỗi ngày một lần lúc 0h UTC (7h sáng Việt Nam). GitHub có thể trễ vài phút.
    - cron: '0 0 * * *'
  workflow_dispatch:

concurrency:
  # Một lượt chạy tại một thời điểm: hai lượt chồng nhau sẽ tranh nhau cùng
  # những bài mới và chỉ tạo ra công viết lại trùng lặp, tốn tiền model.
  group: ingest
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - run: npm run ingest
        env:
          NEWSDATA_API_KEY: ${{ secrets.NEWSDATA_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # Bỏ trống REWRITE_PROVIDER thì code tự chọn Gemini khi có key.
          # Thiếu dòng GEMINI_API_KEY ở đây là runner luôn rơi về bai, dù
          # secret Gemini đã nằm trên repo.
          REWRITE_PROVIDER: ${{ secrets.REWRITE_PROVIDER }}
          # Nhiều key ngăn bằng dấu phẩy: quota free tier tính theo project nên
          # mỗi key là một lần hạn mức nữa. Secret trống thì code tự bỏ qua, vì
          # vậy cứ để sẵn chỗ cho key thứ ba trở đi.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }},${{ secrets.GEMINI_API_KEY_2 }},${{ secrets.GEMINI_API_KEY_3 }}
          BAI_API_KEY: ${{ secrets.BAI_API_KEY }}
          # Dùng biến repo (không phải secret) để log không bị che tên model —
          # nhịp gọi và budget suy ra từ trần free tier của đúng model này.
          # Thang model dự phòng, cách nhau bằng dấu phẩy. Bỏ trống thì dùng
          # thang mặc định trong rewrite.ts (3.6 -> 3.5 -> 2.5 -> 2 bậc lite).
          GEMINI_MODELS: ${{ vars.GEMINI_MODELS }}
          REWRITE_MAX_PER_RUN: ${{ vars.REWRITE_MAX_PER_RUN }}
          # Ping IndexNow sau khi ghi xong. Khoá là public theo thiết kế (site
          # phải phục vụ nó ở /indexnow-key.txt) nên để dạng biến, không secret.
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          INDEXNOW_KEY: ${{ vars.INDEXNOW_KEY }}
